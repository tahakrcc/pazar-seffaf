# Render Blueprint — repo kökünden "Blueprint bağla" ile kullanın.
# İlk kurulumdan sonra: Static Site üzerinde VITE_API_BASE_URL = Web Service'in genel HTTPS adresi
# (örn. https://pazar-api.onrender.com). Backend'de CORS_ORIGINS = frontend'in genel adresi.

databases:
  - name: pazar-db
    databaseName: pazar

services:
  - type: web
    name: pazar-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: pazar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Frontend'in yayın URL'i (virgülle birden fazla). Örnek: https://pazar-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pazar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend Web Service URL'i, sonunda / olmadan (Blueprint kurulumundan sonra panelden girin).
      - key: VITE_API_BASE_URL
        sync: false
